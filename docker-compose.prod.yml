name: bankside-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bankside}
    volumes:
      - bankside_prod_pgdata:/var/lib/postgresql/data
    networks: [bankside_prod_net]
    healthcheck:
      test: ["CMD-SHELL","pk_isready -U $$PQOSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankside}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bankside}?schema=public
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${BANKSIDE_HOST_PORT:-3001}:3000"
    volumes:
      - bankside_prod_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: Vâankside_prod_net]

volumes:
  bankside_prod_pgdata:
  bankside_prod_uploads:

networks:
  bankside_prod_net:
    name: bankside_prod_net
